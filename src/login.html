<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — AIRA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tailwind.css">
</head>
<body class="login-page">

  <!-- Navigasi Atas -->
  <header class="navbar flex items-center justify-between">
    <div class="navbar-left flex items-center gap-3">
      <a href="index.html" class="logo">
        <span class="logo-text">AIRA</span>
      </a>
    </div>

    <div class="navbar-actions flex items-center gap-2">
      <a href="index.html" class="back-link">&larr; Kembali ke Panggung</a>
    </div>
  </header>

  <!-- Kontainer Kartu Masuk (Login Card) -->
  <main class="login-container flex items-center justify-center">

    <section class="login-card flex flex-col gap-6" aria-labelledby="signin-heading">
      <h1 id="signin-heading">Masuk Akun</h1>
      <p class="login-subtitle">Masukkan email dan kata sandi untuk masuk ke AIRA.</p>

      <!-- Form Masuk Akun -->
      <form action="index.html" method="get" class="login-form flex flex-col gap-4" novalidate>
        <div class="form-group">
          <label for="user-email">Alamat Email <span class="required-asterisk">*</span></label>
          <input
            type="email"
            id="user-email"
            name="email"
            placeholder="nama@email.com"
            autocomplete="email"
          >
          <div id="email-error" class="inline-error-text" style="display: none;">Email wajib diisi.</div>
        </div>

        <div class="form-group">
          <label for="user-password">Kata Sandi <span class="required-asterisk">*</span></label>
          <input
            type="password"
            id="user-password"
            name="password"
            placeholder="Masukkan kata sandi"
            autocomplete="current-password"
          >
          <div id="password-error" class="inline-error-text" style="display: none;">Kata sandi wajib diisi.</div>
        </div>

        <button type="submit" class="continue-btn">Masuk</button>
      </form>

      <!-- Informasi Ketentuan & Kebijakan -->
      <p class="login-legal">
        Dengan masuk, kamu menyetujui <a href="#terms">Ketentuan Layanan</a> dan <a href="#privacy">Kebijakan Privasi</a> AIRA.
      </p>
    </section>

  </main>

  <!-- jQuery & Logika Interaktif Client-Side (Week 5) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
