<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — AIRA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <!-- Navigasi Atas -->
  <header class="navbar">
    <div class="navbar-left">
      <a href="index.html" class="logo">
        <span class="logo-text">AIRA</span>
      </a>
    </div>

    <div class="navbar-actions">
      <a href="index.html" class="back-link">&larr; Kembali ke Panggung</a>
    </div>
  </header>

  <!-- Kontainer Kartu Masuk (Login Card) -->
  <main class="login-container">

    <section class="login-card" aria-labelledby="signin-heading">
      <h1 id="signin-heading">Masuk Akun</h1>
      <p class="login-subtitle">Masukkan email dan kata sandi untuk masuk ke AIRA.</p>

      <!-- Form Masuk Akun -->
      <form action="index.html" method="get" class="login-form">
        <div class="form-group">
          <label for="user-email">Alamat Email:</label>
          <input
            type="email"
            id="user-email"
            name="email"
            placeholder="nama@email.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="user-password">Kata Sandi:</label>
          <input
            type="password"
            id="user-password"
            name="password"
            placeholder="Masukkan kata sandi"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="continue-btn">Masuk</button>
      </form>

      <!-- Informasi Ketentuan & Kebijakan -->
      <p class="login-legal">
        Dengan masuk, kamu menyetujui <a href="#terms">Ketentuan Layanan</a> dan <a href="#privacy">Kebijakan Privasi</a> AIRA.
      </p>
    </section>

  </main>

</body>
</html>
